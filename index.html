  <style>
    :root {
      color-scheme: dark;
      --ink: #fff8e8;
      --muted: rgba(255, 248, 232, .72);

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {

    .intro-sticker { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .18)); animation: intro-sticker-bob 2.8s ease-in-out 1.4s infinite; transform-origin: 50% 85%; }

    .gift { position: relative; z-index: 2; width: 112px; height: 96px; filter: drop-shadow(0 18px 14px rgba(0, 0, 0, .24)); animation: gift-float 2.6s ease-in-out infinite; }

    .balloon::after { content: ""; position: absolute; top: calc(100% + 7px); left: 50%; width: 1px; height: 90px; background: rgba(255, 248, 232, .45); }
    .balloon.one { left: 5%; background: #e86f68; --drift: 28px; --end: -13px; --duration: 11s; --delay: .2s; }
    .balloon.two { left: 22%; width: 44px; height: 57px; background: #e7b348; --drift: -34px; --end: 15px; --duration: 13s; --delay: 3.4s; }
    .balloon.three { right: 7%; background: #3f968a; --drift: -30px; --end: 14px; --duration: 12s; --delay: 1.7s; }

    .s1 { top: 18%; left: 13%; animation-delay: 1.1s; } .s2 { top: 27%; right: 14%; animation-delay: 2.4s; }
    .s3 { top: 48%; left: 7%; animation-delay: 3.5s; } .s4 { top: 55%; right: 9%; animation-delay: 1.8s; }
    .s5 { top: 71%; left: 17%; animation-delay: 4.2s; } .s6 { top: 74%; right: 20%; animation-delay: 2.9s; }

    .scene-sticker img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 8px 9px rgba(0, 0, 0, .22)); }
    .scene-sticker.photo img { width: 90%; height: 90%; border: 2px solid rgba(255, 248, 232, .84); border-radius: 6px; object-fit: cover; box-shadow: 0 8px 14px rgba(0, 0, 0, .18); }
    .scene-sticker.sticker-one { top: 18%; left: 4%; --tilt: -7deg; --tilt-end: -2deg; --delay: 180ms; --float-time: 3.2s; }
    .scene-sticker.sticker-two { top: 16%; right: 5%; width: 78px; height: 78px; --tilt: 6deg; --tilt-end: 1deg; --delay: 320ms; --float-time: 3.6s; }
    .scene-sticker.sticker-three { top: 50%; left: 13%; width: 76px; height: 76px; --tilt: -4deg; --tilt-end: 2deg; --delay: 520ms; --float-time: 3.4s; }
    .scene-sticker.sticker-four { top: 48%; right: 13%; --tilt: 8deg; --tilt-end: 3deg; --delay: 680ms; --float-time: 3.1s; }
    .scene-sticker.sticker-five { bottom: 15%; left: 5%; width: 70px; height: 70px; --tilt: 5deg; --tilt-end: -1deg; --delay: 840ms; --float-time: 3.8s; }
    .scene-sticker.sticker-six { right: 5%; bottom: 16%; --tilt: -6deg; --tilt-end: 0deg; --delay: 960ms; --float-time: 3.5s; }
    .scene-sticker.sticker-seven { top: 12%; left: calc(50% - 32px); width: 64px; height: 64px; --tilt: 4deg; --tilt-end: -2deg; --delay: 1100ms; --float-time: 3.3s; }
    .scene-sticker.sticker-eight { top: 18%; left: 22%; width: 62px; height: 62px; --tilt: -5deg; --tilt-end: 2deg; --delay: 260ms; --float-time: 3.7s; }
    .scene-sticker.sticker-nine { top: 19%; right: 22%; width: 66px; height: 66px; --tilt: 7deg; --tilt-end: 1deg; --delay: 430ms; --float-time: 3.4s; }
    .scene-sticker.sticker-ten { top: 42%; left: 25%; width: 64px; height: 64px; --tilt: 3deg; --tilt-end: -3deg; --delay: 590ms; --float-time: 3.9s; }
    .scene-sticker.sticker-eleven { top: 40%; right: 25%; width: 66px; height: 66px; --tilt: -8deg; --tilt-end: -1deg; --delay: 750ms; --float-time: 3.2s; }
    .scene-sticker.sticker-twelve { bottom: 22%; left: 23%; width: 62px; height: 62px; --tilt: 6deg; --tilt-end: 0deg; --delay: 910ms; --float-time: 3.6s; }
    .scene-sticker.sticker-thirteen { right: 23%; bottom: 22%; width: 62px; height: 62px; --tilt: -4deg; --tilt-end: 2deg; --delay: 1040ms; --float-time: 3.5s; }
    .scene-sticker.sticker-fourteen { top: 11%; left: 34%; width: 58px; height: 58px; --tilt: -6deg; --tilt-end: 1deg; --delay: 1160ms; --float-time: 3.8s; }
    .scene-sticker.sticker-fifteen { top: 11%; right: 34%; width: 58px; height: 58px; --tilt: 5deg; --tilt-end: -2deg; --delay: 1240ms; --float-time: 3.3s; }
    .scene-sticker.sticker-sixteen { bottom: 9%; left: 35%; width: 54px; height: 54px; --tilt: 8deg; --tilt-end: 2deg; --delay: 1320ms; --float-time: 3.6s; }
    .scene-sticker.sticker-seventeen { right: 35%; bottom: 9%; width: 54px; height: 54px; --tilt: -7deg; --tilt-end: 0deg; --delay: 1400ms; --float-time: 3.4s; }

    .message-area { position: relative; z-index: 2; display: flex; flex: 1; width: min(100%, 520px); flex-direction: column; align-items: center; justify-content: center; margin-top: -12px; text-shadow: 0 2px 20px rgba(0, 0, 0, .28); }
    .for-line { margin: 0 0 8px; color: var(--gold); font-size: 13px; font-weight: 700; letter-spacing: .18em; }
    #receiver { letter-spacing: .04em; }
    .celebration h1 { font-size: clamp(52px, 15vw, 88px); }
    .celebration h1 span { display: inline-block; transform-origin: 50% 80%; }

    .wish { display: grid; place-items: center; min-height: 64px; margin: 18px 0 12px; color: rgba(255, 248, 232, .92); font-size: clamp(16px, 4.4vw, 21px); line-height: 1.75; letter-spacing: .03em; transition: opacity 360ms ease, transform 360ms ease; }
    .wish.is-changing { opacity: 0; transform: translateY(8px); }
    .wish.is-changing[data-transition="slide"] { transform: translateX(-18px); }
    .wish.is-changing[data-transition="zoom"] { transform: scale(.9); }
    .wish.enter-rise { animation: wish-rise 620ms ease both; } .wish.enter-slide { animation: wish-slide 620ms ease both; } .wish.enter-zoom { animation: wish-zoom 620ms ease both; }

    .cake-stage { position: relative; flex: none; width: 270px; height: 220px; margin-top: 4px; }
    .cake-scene { --cake-rest: 1; --cake-crouch: .92; --cake-launch: 1.15; --cake-impact: 5.4; position: absolute; inset: 0; z-index: 2; width: 270px; height: 220px; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; transform: scale(var(--cake-rest)); transform-origin: 50% 58%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .cake-scene:focus-visible { outline: 3px solid var(--gold); outline-offset: 6px; border-radius: 8px; }
    .cake-scene:active { transform: scale(var(--cake-crouch)); }
    .plate { position: absolute; left: 50%; bottom: 16px; width: 260px; height: 28px; border-radius: 50%; background: rgba(255, 248, 232, .9); box-shadow: 0 14px 24px rgba(0, 0, 0, .25); transform: translateX(-50%); }
    .cake-bottom, .cake-top { position: absolute; left: 50%; border-radius: 10px 10px 22px 22px; transform: translateX(-50%); }
    .cake-bottom { bottom: 30px; width: 220px; height: 90px; background: #d95055; }
    .cake-top { bottom: 112px; width: 152px; height: 54px; background: #e97870; }
    .cake-bottom::before, .cake-top::before { content: ""; position: absolute; inset: 0 0 auto; height: 24px; border-radius: 10px 10px 16px 16px; background: #ffdda0; }
    .cake-bottom::after, .cake-top::after { content: ""; position: absolute; top: 14px; width: 22px; height: 20px; border-radius: 0 0 12px 12px; background: #ffdda0; }
    .cake-bottom::after { left: 28px; box-shadow: 58px -3px 0 -3px #ffdda0, 126px 1px 0 -2px #ffdda0; }
    .cake-top::after { left: 22px; width: 18px; height: 17px; box-shadow: 42px 2px 0 -2px #ffdda0, 88px -2px 0 -3px #ffdda0; }
    .candle { position: absolute; bottom: 164px; width: 10px; height: 42px; border-radius: 3px 3px 0 0; background: repeating-linear-gradient(-35deg, #f8d56e 0 7px, #4aa090 7px 13px); }
    .candle.one { left: 94px; } .candle.two { left: 130px; height: 50px; } .candle.three { left: 166px; }
    .flame { position: absolute; left: 50%; bottom: calc(100% + 4px); width: 15px; height: 24px; border-radius: 70% 30% 68% 32%; background: #ffd65a; box-shadow: 0 0 16px 5px rgba(255, 193, 75, .42); transform: translateX(-50%); transform-origin: 50% 100%; animation: flame 620ms ease-in-out infinite alternate; }
    .candle.two .flame { animation-delay: -180ms; } .candle.three .flame { animation-delay: -330ms; }

    .footer { position: relative; z-index: 2; display: grid; width: min(100%, 520px); justify-items: center; gap: 12px; }
    .signature { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .06em; }
    .footer-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

    .impact-flash { position: absolute; inset: 0; z-index: 15; background: #ffdda0; opacity: 0; visibility: hidden; pointer-events: none; }

    .letter-view {
      z-index: 4;
      justify-content: space-between;
      opacity: 0;
      visibility: hidden;
      transform: translateX(6%);
      background: linear-gradient(180deg, rgba(11, 27, 31, .78), rgba(67, 31, 42, .87));
      transition: opacity 650ms ease, transform 650ms ease, visibility 0s linear 650ms;
    }

    .letter-view .toolbar { justify-content: space-between; width: 100%; }
    .letter-content { position: relative; display: flex; flex: 1; width: min(100%, 580px); flex-direction: column; justify-content: center; align-items: stretch; min-height: 0; padding: 18px 0; text-align: left; }
    .letter-content::before { content: "“"; position: absolute; top: 3%; left: -6px; color: rgba(246, 200, 95, .16); font-family: Georgia, serif; font-size: 142px; line-height: 1; }
    .letter-heading { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
    .letter-heading-copy { min-width: 0; }
    .letter-kicker { position: relative; margin: 0 0 10px; color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .letter-content h2 { position: relative; font-size: clamp(34px, 10vw, 58px); }
    .letter-rule { width: 58px; height: 3px; margin: 18px 0 12px; border: 0; background: var(--gold); }
    .letter-copy { position: relative; flex: 1; min-height: 0; max-height: min(47vh, 430px); padding: 2px 10px 2px 0; overflow-y: auto; overscroll-behavior: contain; color: rgba(255, 248, 232, .92); font-size: 17px; line-height: 1.95; letter-spacing: .04em; scrollbar-width: thin; }
    .letter-copy.compact { font-size: 15px; line-height: 1.82; }
    .letter-copy p { margin: 0 0 14px; opacity: 0; }
    .letter-signature { margin: 6px 0 0; color: var(--gold); text-align: right; font-family: "STKaiti", "KaiTi", sans-serif; font-size: 19px; }
    .letter-footer { display: flex; justify-content: center; width: 100%; gap: 10px; flex-wrap: wrap; }

    .toast { position: absolute; left: 50%; bottom: max(86px, calc(env(safe-area-inset-bottom) + 70px)); z-index: 10; padding: 9px 14px; border-radius: 4px; background: rgba(6, 15, 18, .9); color: var(--ink); font-size: 13px; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity 220ms ease, transform 220ms ease; }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    .experience.is-opening .gift-lid { transform: translate(14px, -42px) rotate(23deg); }
    .experience.is-open .intro { opacity: 0; pointer-events: none; transform: scale(.96); }
    .experience.is-open .celebration { opacity: 1; visibility: visible; transform: scale(1); transition-delay: 150ms; }
    .experience.is-open .scene-sticker { animation: scene-sticker-enter 760ms cubic-bezier(.2, .85, .25, 1.25) var(--delay) both, scene-sticker-float var(--float-time) ease-in-out calc(var(--delay) + 760ms) infinite; }
    .experience.is-open .balloon { animation: balloon-rise var(--duration) ease-in infinite; animation-delay: var(--delay); }
    .experience.is-open .sparkle { animation: sparkle 2.8s ease-in-out infinite; }
    .experience.is-celebrating .celebration h1 span { animation: letter-pop 720ms cubic-bezier(.18, .9, .3, 1.35) both; }
    .experience.is-celebrating .celebration h1 span:nth-child(2) { animation-delay: 90ms; }
    .experience.is-celebrating .celebration h1 span:nth-child(3) { animation-delay: 180ms; }
    .experience.is-celebrating .celebration h1 span:nth-child(4) { animation-delay: 270ms; }
    .experience.is-celebrating .cake-scene { animation: cake-arrive 950ms cubic-bezier(.18, .85, .28, 1.3) both; }

    .experience.is-cake-throwing .message-area { z-index: 12; }
    .experience.is-cake-throwing .cake-scene { z-index: 13; pointer-events: none; animation: cake-throw 940ms cubic-bezier(.52, .02, .9, .42) both !important; }
    .experience.is-cake-throwing .for-line,
    .experience.is-cake-throwing .celebration h1,
    .experience.is-cake-throwing .wish,
    .experience.is-cake-throwing .toolbar,
    .experience.is-cake-throwing .footer { opacity: 0; transform: scale(.95); transition: opacity 220ms ease, transform 220ms ease; }
    .experience.is-cake-throwing #effects { opacity: .18; }
    .experience.is-cake-throwing .impact-flash { visibility: visible; animation: impact-flash 540ms ease-out 560ms both; }

    .experience.is-letter .celebration { opacity: 0; visibility: hidden; transform: translateX(-5%); transition-delay: 0s; }
    .experience.is-letter #effects { opacity: 0; }
    .experience.is-letter .letter-view { opacity: 1; visibility: visible; transform: translateX(0); transition-delay: 120ms; }
    .experience.is-letter .letter-copy p { animation: paragraph-reveal 650ms ease both; animation-delay: calc(var(--index) * 140ms + 280ms); }

    @keyframes gift-float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
    @keyframes intro-sticker-pop { 0% { opacity: 0; transform: translate(-24px, 28px) scale(.55) rotate(-10deg); } 72% { opacity: 1; transform: translate(4px, -5px) scale(1.06) rotate(3deg); } 100% { opacity: 1; transform: none; } }
    @keyframes intro-sticker-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
    @keyframes flame { from { transform: translateX(-50%) rotate(-6deg) scale(.92, 1.05); } to { transform: translateX(-50%) rotate(7deg) scale(1.06, .92); } }
    @keyframes cake-arrive { from { opacity: 0; transform: translateY(70px) scale(.84); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes letter-pop { 0% { opacity: 0; transform: translateY(20px) rotate(-7deg) scale(.65); } 70% { opacity: 1; transform: translateY(-4px) rotate(2deg) scale(1.08); } 100% { opacity: 1; transform: none; } }
    @keyframes balloon-rise { 0% { opacity: 0; transform: translate3d(0, 0, 0) rotate(-4deg); } 10% { opacity: .66; } 45% { transform: translate3d(var(--drift), -55vh, 0) rotate(5deg); } 88% { opacity: .58; } 100% { opacity: 0; transform: translate3d(var(--end), -120vh, 0) rotate(-5deg); } }
    @keyframes sparkle { 0%, 100% { opacity: 0; transform: rotate(45deg) scale(.35); } 45% { opacity: .9; transform: rotate(135deg) scale(1.2); } 65% { opacity: .42; transform: rotate(180deg) scale(.72); } }
    @keyframes wish-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes wish-slide { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
    @keyframes wish-zoom { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }
    @keyframes paragraph-reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes cake-throw {
      0% { opacity: 1; transform: translateY(0) scale(var(--cake-rest)) rotate(0); }
      18% { opacity: 1; transform: translateY(18px) scale(var(--cake-crouch)) rotate(-3deg); }
      42% { opacity: 1; transform: translateY(-22px) scale(var(--cake-launch)) rotate(4deg); }
      86% { opacity: 1; transform: translateY(-7vh) scale(var(--cake-impact)) rotate(-6deg); }
      100% { opacity: 0; transform: translateY(-7vh) scale(var(--cake-impact)) rotate(-6deg); }

  <script>
    // 修改这里即可定制内容；网址参数 name、from、message、letter 也会覆盖对应项目。
    const CONFIG = {
      name: "栗子老大",
      from: "天才少年",
      message: "",
      letter: `今天是属于你的日子，想认真地对你说一声：生日快乐(虽然不知道你是什么时候才能发现)

希望你可以越来越好好，指的是可以好好吃饭，按时休息，保持健康

是可以越长大 内心越平静温和

是坚决坚定自己的选择 不做让自己后悔的事情

是能够更坚定的选择理想生活

是可以凭自己照顾好自己 

是保持永远真诚 是学会好好爱自己，好好生活

深深祝福你和你生活里的每一天 老大 我们依旧拥有珍贵的一切 所以继续随心所欲的活着吧!
`
    };

    const params = new URLSearchParams(location.search);
    const clean = (value, fallback, max) => ((value || "").trim().slice(0, max) || fallback);
    const name = clean(params.get("name"), CONFIG.name, 18);
    const from = clean(params.get("from"), CONFIG.from, 24);
    const customMessage = clean(params.get("message"), CONFIG.message, 80);
    const letterText = clean(params.get("letter"), CONFIG.letter, 800);
    const wishes = customMessage ? [customMessage, "希望你身体健康", "希望你不再为明天的事情烦忧"] : ["希望你身体健康", "希望你不再为明天的事情烦忧", "希望你多珍视自己"];

    const byId = (id) => document.getElementById(id);
    const experience = byId("experience");
    const intro = byId("intro");
    const celebration = byId("celebration");
    const letterView = byId("letter-view");
    const openButton = byId("open-button");
    const soundButton = byId("sound-button");
    const replayButton = byId("replay-button");
    const cakeButton = byId("cake-button");
    const letterBack = byId("letter-back");
    const letterBackTop = byId("letter-back-top");
    const shareButton = byId("share-button");
    const letterShare = byId("letter-share");
    const wish = byId("wish");
    const toast = byId("toast");
    const canvas = byId("effects");
    const context = canvas.getContext("2d");
    const reduceMotion = params.get("motion") === "reduce";
    experience.classList.toggle("reduce-motion", reduceMotion);

    byId("receiver").textContent = name;
    byId("sender").textContent = from;
    byId("letter-name").textContent = name;
    byId("letter-sender").textContent = from;
    wish.textContent = wishes[0];
    document.title = `${name}，生日快乐`;

    const letterCopy = byId("letter-copy");
    letterText.split(/\n\s*\n/).filter(Boolean).forEach((text, index) => {
      const paragraph = document.createElement("p");
      paragraph.textContent = text.trim();
      paragraph.style.setProperty("--index", index);
      letterCopy.appendChild(paragraph);
    });
    if (letterText.length > 180) letterCopy.classList.add("compact");

    let opened = false;
    let soundOn = true;
    let audioContext = null;
    let audioTimer = null;
    let wishTimer = null;
    let wishTimeout = null;
    let toastTimer = null;
    let particles = [];
    let sparks = [];
    let sceneTimers = [];
    let animationFrame = null;
    let burstUntil = 0;
    let cakeThrowing = false;
    let cakeThrowTimer = null;

    const melody = [["G4",.36],["G4",.18],["A4",.55],["G4",.55],["C5",.55],["B4",1.05],["G4",.36],["G4",.18],["A4",.55],["G4",.55],["D5",.55],["C5",1.05],["G4",.36],["G4",.18],["G5",.55],["E5",.55],["C5",.55],["B4",.55],["A4",1.05],["F5",.36],["F5",.18],["E5",.55],["C5",.55],["D5",.55],["C5",1.25]];
    const frequencies = {G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};

    function playMelody() {
      if (!soundOn) return;
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume();
      const start = audioContext.currentTime + .08;
      let cursor = start;
      melody.forEach(([note, duration]) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = frequencies[note];
        gain.gain.setValueAtTime(.0001, cursor);
        gain.gain.exponentialRampToValueAtTime(.13, cursor + .025);
        gain.gain.exponentialRampToValueAtTime(.0001, cursor + duration - .03);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(cursor); oscillator.stop(cursor + duration);
        cursor += duration + .07;
      });
      clearTimeout(audioTimer);
      audioTimer = setTimeout(playMelody, Math.max(1000, (cursor - start + 1.8) * 1000));
    }

    function stopMelody() { clearTimeout(audioTimer); audioTimer = null; if (audioContext?.state === "running") audioContext.suspend(); }

    function startWishes() {
      clearInterval(wishTimer); clearTimeout(wishTimeout);
      let index = 0;
      const transitions = ["rise", "slide", "zoom"];
      wish.className = "wish"; wish.textContent = wishes[0];
      if (reduceMotion) return;
      wishTimer = setInterval(() => {
        const transition = transitions[index % transitions.length];
        wish.dataset.transition = transition;
        wish.classList.add("is-changing");
        wishTimeout = setTimeout(() => {
          index = (index + 1) % wishes.length;
          wish.textContent = wishes[index];
          wish.classList.remove("is-changing");
          wish.classList.add(`enter-${transition}`);
          wishTimeout = setTimeout(() => wish.classList.remove(`enter-${transition}`), 650);
        }, 360);
      }, 4300);
    }

    function resizeCanvas() {
      const ratio = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * ratio); canvas.height = Math.floor(innerHeight * ratio);
      canvas.style.width = `${innerWidth}px`; canvas.style.height = `${innerHeight}px`;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function makeParticle(burst = false) {
      const colors = ["#f6c85f", "#ef746f", "#53a99b", "#fff4d5"];
      return { x: burst ? innerWidth * (.38 + Math.random() * .24) : Math.random() * innerWidth, y: burst ? innerHeight * .62 : -24 - Math.random() * innerHeight * .35, vx: burst ? (Math.random() - .5) * 8 : (Math.random() - .5) * 1.6, vy: burst ? -5 - Math.random() * 7 : 1.4 + Math.random() * 2.5, gravity: burst ? .16 : .025, rotation: Math.random() * Math.PI, spin: (Math.random() - .5) * .22, width: 5 + Math.random() * 7, height: 9 + Math.random() * 13, color: colors[Math.floor(Math.random() * colors.length)], opacity: .8 + Math.random() * .2 };
    }

    function firework(xRatio, yRatio) {
      if (reduceMotion) return;
      const colors = ["#f6c85f", "#ef746f", "#53a99b", "#fff4d5"];
      const x = innerWidth * xRatio, y = innerHeight * yRatio, color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 46; i++) {
        const angle = Math.PI * 2 * i / 46 + Math.random() * .08, speed = 1.8 + Math.random() * 3.8;
        sparks.push({ x, y, px:x, py:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, opacity:.95, decay:.012+Math.random()*.01, color });
      }
    }

    function draw(time) {
      context.clearRect(0, 0, innerWidth, innerHeight);
      if (time < burstUntil && particles.length < 135) for (let i = 0; i < 6; i++) particles.push(makeParticle(true));
      particles.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.rotation += p.spin;
        context.save(); context.globalAlpha = p.opacity; context.translate(p.x, p.y); context.rotate(p.rotation); context.fillStyle = p.color; context.fillRect(-p.width/2, -p.height/2, p.width, p.height); context.restore();
      });
      sparks.forEach((s) => {
        s.px=s.x; s.py=s.y; s.x+=s.vx; s.y+=s.vy; s.vx*=.985; s.vy=s.vy*.985+.04; s.opacity-=s.decay;
        context.save(); context.globalAlpha=Math.max(0,s.opacity); context.strokeStyle=s.color; context.lineWidth=2; context.lineCap="round"; context.shadowColor=s.color; context.shadowBlur=8; context.beginPath(); context.moveTo(s.px,s.py); context.lineTo(s.x,s.y); context.stroke(); context.restore();
      });
      particles = particles.filter((p) => p.y < innerHeight + 40); sparks = sparks.filter((s) => s.opacity > .02);
      while (particles.length < 48 && !reduceMotion) particles.push(makeParticle());
      animationFrame = requestAnimationFrame(draw);
    }

    function burstConfetti() { if (reduceMotion) return; burstUntil = performance.now() + 520; for (let i=0;i<48;i++) particles.push(makeParticle(true)); if (!animationFrame) animationFrame=requestAnimationFrame(draw); }

    function runScene() {
      sceneTimers.forEach(clearTimeout); sceneTimers=[];
      experience.classList.remove("is-celebrating"); void experience.offsetWidth; experience.classList.add("is-celebrating");
      burstConfetti();
      sceneTimers.push(setTimeout(()=>firework(.23,.27),1100), setTimeout(()=>firework(.78,.22),2200), setTimeout(burstConfetti,4700), setTimeout(()=>firework(.72,.34),6200), setTimeout(()=>firework(.28,.2),7500));
    }

    function openExperience() {
      if (opened) return;
      opened=true; experience.classList.add("is-opening"); burstConfetti(); playMelody();
      setTimeout(() => { experience.classList.add("is-open"); intro.setAttribute("aria-hidden","true"); celebration.setAttribute("aria-hidden","false"); startWishes(); runScene(); }, reduceMotion ? 0 : 480);
    }

    function playCakeImpact() {
      if (!soundOn || !audioContext) return;
      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(190, now);
      oscillator.frequency.exponentialRampToValueAtTime(48, now + .34);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.16, now + .015);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .38);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now); oscillator.stop(now + .4);
    }

    function throwCake() {
      if (cakeThrowing || experience.classList.contains("is-letter")) return;
      cakeThrowing = true;
      cakeButton.disabled = true;
      experience.classList.add("is-cake-throwing");
      clearTimeout(cakeThrowTimer);
      if (!reduceMotion) setTimeout(playCakeImpact, 590);
      cakeThrowTimer = setTimeout(() => {
        showLetter();
        setTimeout(() => {
          experience.classList.remove("is-cake-throwing");
          cakeButton.disabled = false;
          cakeThrowing = false;
        }, reduceMotion ? 0 : 650);
      }, reduceMotion ? 40 : 940);
    }

    function showLetter() {
      experience.classList.add("is-letter"); celebration.setAttribute("aria-hidden","true"); letterView.setAttribute("aria-hidden","false"); letterCopy.scrollTop=0;
    }

    function hideLetter() { experience.classList.remove("is-letter", "is-cake-throwing"); celebration.setAttribute("aria-hidden","false"); letterView.setAttribute("aria-hidden","true"); cakeButton.disabled=false; cakeThrowing=false; }
    function replay() { hideLetter(); runScene(); startWishes(); if (soundOn) { stopMelody(); setTimeout(playMelody,80); } }
    function showToast(message) { clearTimeout(toastTimer); toast.textContent=message; toast.classList.add("is-visible"); toastTimer=setTimeout(()=>toast.classList.remove("is-visible"),2200); }

    async function share() {
      const data={title:`${name}，生日快乐`,text:`${name}，送你一份生日祝福`,url:location.href};
      try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); showToast("链接已复制"); } }
      catch (error) { if (error.name !== "AbortError") showToast("请从浏览器菜单分享此页面"); }
    }

    openButton.addEventListener("click",openExperience);
    replayButton.addEventListener("click",replay);
    cakeButton.addEventListener("click",throwCake);
    letterBack.addEventListener("click",hideLetter);
    letterBackTop.addEventListener("click",hideLetter);
    shareButton.addEventListener("click",share);
    letterShare.addEventListener("click",share);
    soundButton.addEventListener("click",()=>{ soundOn=!soundOn; soundButton.textContent=soundOn?"♪":"×"; soundButton.setAttribute("aria-label",soundOn?"暂停音乐":"播放音乐"); soundButton.title=soundOn?"暂停音乐":"播放音乐"; if(soundOn)playMelody();else stopMelody(); });
    addEventListener("resize",resizeCanvas,{passive:true}); resizeCanvas();
  </script>
</body>
</html>
